    answer: `
      <p>Миссии Макартнея (1792–1794), Амхерста (1816) и Нэпира (1834) — три ключевые британские дипломатические/торговые миссии в Цинский Китай.</p>
      <p>Все они были направлены Великобританией в условиях жёсткой торговой монополии Китая (торговля только через Кантон/Гуанчжоу и через китайскую купеческую гильдию Гунхан/Кохонг) и полного отсутствия официальных дипломатических отношений. Китай рассматривал иностранцев как «варваров», приносящих дань, и требовал выполнения церемониала (в т.ч. коутоу).</p>
      <p>Все три миссии провалились, но стали важными этапами подготовки к силовому «открытию» Китая (Первая опиумная война 1839–1842).</p>

      <h3>1. Миссия лорда Джорджа Макартнея (1792–1794, принята в 1793)</h3>
      <ul>
        <li><strong>Когда:</strong> отправлена в сентябре 1792 г., прибыла в Китай в 1793 г. (аудиенция у императора Цяньлуна 14 сентября 1793 г.), вернулась в 1794 г.</li>
        <li><strong>Цель:</strong> установить постоянные дипломатические отношения и аккредитовать британского посланника в Пекине; открыть дополнительные порты; ликвидировать монополию Гунхана; получить остров для торговой базы; обеспечить свободу поселения и передвижения британских подданных.</li>
        <li><strong>Результат:</strong> полный провал. Цяньлун вежливо принял посольство, но отверг все требования. Миссия собрала ценные сведения о Китае, но ничего не изменила.</li>
      </ul>

      <h3>2. Миссия лорда Уильяма Питта Амхерста (1816)</h3>

      </ul>

      <h3>3. Миссия лорда Уильяма Джона Нэпира (1834)</h3>

        <li><strong>Когда:</strong> 1834 г. (после отмены монополии Ост-Индской компании в 1833–1834 гг.).</li>

        <li><strong>Результат:</strong> провал и обострение конфликта. Нэпир отказался следовать китайскому протоколу, был блокирован, уехал в Макао, где умер в октябре 1834 г. Инцидент стал предвестником Первой опиумной войны.</li>
      </ul>

      <h3>Общий контекст</h3>
      <p>Все три миссии отражают переход британской политики от мирного «открытия» Китая к силовому давлению. Неудачи убедили Лондон, что только военное давление позволит добиться свободной торговли. Это напрямую вело к опиумным войнам и превращению Китая в полуколонию.</p>
    `

      <p>Из текста самого договора (статья 3) прямо следует, что ключевым вопросом был русский город <strong>Албазин</strong>, построенный на стороне Царского Величества. По условиям договора его требовалось разорить до основания, а всех находившихся там людей со всеми воинскими и иными припасами вывести в сторону России, не оставив там ничего.</p>

      <p>По Нерчинскому договору 27 августа 1689 г. определялся участок русско-китайской границы <strong>в Приамурье (Даурской земле)</strong>.</p>

/* ============================================================
   ЛОГИКА САЙТА — НЕ ТРОГАЙ, ЕСЛИ НЕ УВЕРЕН
   ============================================================ */

let currentIndex = 0;
let doneSet = new Set(JSON.parse(localStorage.getItem('history_done') || '[]'));

function saveDone() {
  localStorage.setItem('history_done', JSON.stringify([...doneSet]));
}

function renderList() {
  const list = document.getElementById('questionList');
  list.innerHTML = '';
  questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q-item';
    if (i === currentIndex) div.classList.add('active');
    if (doneSet.has(q.id)) div.classList.add('done');
    div.innerHTML = `<span class="q-num">${q.id}</span><span>${q.question}</span>`;
    div.onclick = () => {
      currentIndex = i;
      renderAll();
    };
    list.appendChild(div);
  });
}

function renderContent() {
  const q = questions[currentIndex];
  if (!q) return;
  document.getElementById('questionTitle').textContent = `${q.id}) ${q.question}`;
  const answerBox = document.getElementById('answerBox');
  answerBox.innerHTML = q.answer;
  answerBox.classList.add('hidden-answer');
  document.getElementById('toggleBtn').textContent = '👁 Показать ответ';

  const doneBtn = document.getElementById('doneBtn');
  if (doneSet.has(q.id)) {
    doneBtn.classList.add('active');
    doneBtn.textContent = '✅ Выучено';
  } else {
    doneBtn.classList.remove('active');
    doneBtn.textContent = '✅ Отметить выученным';
  }
}

function renderProgress() {
  const total = questions.length;
  const done = questions.filter(q => doneSet.has(q.id)).length;
  document.getElementById('progressInfo').textContent = `Выучено: ${done} из ${total}`;
  document.getElementById('progressBar').style.width = (done / total * 100) + '%';
}

function renderAll() {
  renderList();
  renderContent();
  renderProgress();
}

function nextQuestion() {
  currentIndex = (currentIndex + 1) % questions.length;
  renderAll();
}

function prevQuestion() {
  currentIndex = (currentIndex - 1 + questions.length) % questions.length;
  renderAll();
}

function toggleAnswer() {
  const answerBox = document.getElementById('answerBox');
  const btn = document.getElementById('toggleBtn');
  if (answerBox.classList.contains('hidden-answer')) {
    answerBox.classList.remove('hidden-answer');
    btn.textContent = '🙈 Скрыть ответ';
  } else {
    answerBox.classList.add('hidden-answer');
    btn.textContent = '👁 Показать ответ';
  }
}

function markDone() {
  const q = questions[currentIndex];
  if (doneSet.has(q.id)) {
    doneSet.delete(q.id);
  } else {
    doneSet.add(q.id);
  }
  saveDone();
  renderAll();
}

function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  currentIndex = 0;
  renderAll();
}

/* Инициализация */
renderAll();
</script>
